<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2C4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AQUI Istanbul">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<title>AQUI Istanbul</title>
<style>
:root{
  --slip:#FBF8F3; --cobalt:#0E2C4B; --iznik:#1D5FA8; --turq:#1F7A7A;
  --bole:#A83A32; --brass:#9A7628; --ink:#1A1D22; --mute:#6C7480;
  --line:#DED5C6; --card:#FFFFFF;
  --serif: ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--slip);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit}

header.top{background:var(--cobalt);color:#fff;padding:24px 18px 20px;
  padding-top:calc(24px + env(safe-area-inset-top));
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px),
                   repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px)}
.kick{font-family:var(--serif);font-style:italic;font-size:14px;color:#9FC2E4;margin:0 0 3px}
header.top h1{font-family:var(--serif);font-weight:600;font-size:35px;line-height:1;margin:0;letter-spacing:-.015em}
header.top h1 span{display:block;font-size:17px;font-weight:400;font-style:italic;color:#C9DCF0;letter-spacing:0;margin-top:7px}
.dates{font-size:13.5px;color:#9FC2E4;border-top:1px solid rgba(255,255,255,.22);padding-top:11px;margin-top:13px}

nav{position:sticky;top:0;z-index:60;background:var(--slip);border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav div{display:flex;padding:0 10px}
nav button{background:none;border:none;padding:13px 13px;font-size:13.5px;font-weight:650;color:var(--mute);
  white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--cobalt);border-bottom-color:var(--cobalt)}

main{padding:0 15px 70px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.view{display:none;padding-top:24px}
.view.on{display:block}
h2{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em;line-height:1.15}
h3.sub{font-family:var(--serif);font-size:20px;font-weight:600;margin:26px 0 8px}
.lede{color:var(--mute);font-size:14.5px;margin:0 0 18px;max-width:60ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:2px;margin:0 0 10px}
.stripe{border-left:7px solid var(--c,var(--iznik));position:relative}
.stripe::before{content:"";position:absolute;left:-7px;top:0;bottom:0;width:7px;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.42) 0 3px,transparent 3px 7px);pointer-events:none}
.pad{padding:14px 15px}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0}
.tag{font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:2px;background:#EFEAE0;color:#5A5344}
.tag.sun{background:#DFF0EA;color:#12604F}
.tag.shut{background:#F6E2E0;color:#8C2F28}
.tag.star{background:#F5EBD3;color:#7A5C15}
.tag.cat{background:#E4EDF7;color:#164A80}

.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.acts a,.acts button{flex:1 1 0;min-width:76px;text-align:center;padding:10px 4px;font-size:13px;font-weight:650;
  text-decoration:none;border-radius:2px;border:1px solid var(--line);color:var(--cobalt);background:#FCFAF6;cursor:pointer}
.acts a.pri{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.acts a:focus-visible,.acts button:focus-visible,nav button:focus-visible{outline:2px solid var(--iznik);outline-offset:2px}

details.dis{border:1px solid var(--line);border-radius:2px;background:var(--card);margin:0 0 11px;overflow:hidden}
details.dis>summary{list-style:none;cursor:pointer;padding:15px 15px 15px 19px;border-left:7px solid var(--c,var(--iznik))}
details.dis>summary::-webkit-details-marker{display:none}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:600}
.dh .when{font-size:12px;font-weight:700;color:var(--c,var(--iznik));white-space:nowrap;padding-top:5px}
.dsub{font-size:13.5px;color:var(--mute);margin:4px 0 0}
.cnt{font-size:12px;color:var(--mute);margin-top:8px}
.dbody{padding:2px 12px 14px}
.why{font-size:14px;background:#F4EFE6;border-left:3px solid var(--c,var(--iznik));padding:11px 13px;margin:0 0 13px;border-radius:2px}
.why b{display:block;font-size:11.5px;letter-spacing:.07em;color:var(--mute);margin-bottom:4px}

.shop h4{margin:0 0 2px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.shop .addr{font-size:13px;color:var(--mute);margin:0 0 8px}
.shop .txt{font-size:14px;margin:0}
.visited{background:#F2F8F4}
.visited h4::after{content:" ✓";color:var(--turq)}

.track{border-top:1px solid #EEE7DB;margin-top:12px;padding-top:12px}
.verd{display:flex;gap:6px;margin-bottom:10px}
.verd button{flex:1;padding:9px 4px;font-size:13px;font-weight:650;border:1px solid var(--line);
  background:#FCFAF6;color:var(--mute);border-radius:2px;cursor:pointer}
.verd button.y{background:var(--turq);border-color:var(--turq);color:#fff}
.verd button.n{background:#B0524B;border-color:#B0524B;color:#fff}
.verd button.m{background:var(--brass);border-color:var(--brass);color:#fff}
.lbl{font-size:11.5px;letter-spacing:.06em;color:var(--mute);font-weight:700;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.chips button{font-size:12.5px;padding:6px 10px;border:1px solid var(--line);background:#FCFAF6;
  color:var(--mute);border-radius:2px;cursor:pointer}
.chips button.on{background:var(--iznik);border-color:var(--iznik);color:#fff;font-weight:650}
textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:2px;
  background:#FCFAF6;resize:vertical;font-size:14px;color:var(--ink)}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.photos figure{margin:0;position:relative;width:74px;height:74px}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:2px;border:1px solid var(--line)}
.photos button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  border:none;background:#B0524B;color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0}
.addph{display:inline-block;margin-top:10px;padding:9px 14px;font-size:13px;font-weight:650;
  border:1px dashed var(--line);border-radius:2px;color:var(--cobalt);background:#FCFAF6;cursor:pointer}
input[type=file]{display:none}

.check label{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;cursor:pointer;
  border-bottom:1px solid #F0EAE0;font-size:14.5px}
.check label:last-child{border-bottom:none}
.check input{appearance:none;flex:0 0 20px;width:20px;height:20px;margin-top:1px;border:1.5px solid #B9AE9B;
  border-radius:2px;background:#fff;position:relative;cursor:pointer}
.check input:checked{background:var(--turq);border-color:var(--turq)}
.check input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:11px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.check input:checked + span{text-decoration:line-through;color:#A8A296}
.prog{font-size:13px;color:var(--mute);margin:0 0 8px}

.day{cursor:pointer}
.day .dtop{display:flex;gap:12px;align-items:baseline;padding:13px 15px 0}
.day .num{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--cobalt);line-height:1}
.day .dow{font-size:12px;color:var(--mute);font-weight:650}
.day .ttl{font-size:16px;font-weight:650;padding:2px 15px 0}
.day .sm{font-size:13px;color:var(--mute);padding:4px 15px 13px}
.day.today{border:2px solid var(--cobalt)}
.sched{border-top:1px solid #EEE7DB;padding:4px 0 0}
.stop{display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid #F4EFE6}
.stop:last-child{border-bottom:none}
.stop .t{flex:0 0 52px;font-size:13px;font-weight:700;color:var(--cobalt);padding-top:1px}
.stop .b{flex:1}
.stop .n{font-size:14.5px;font-weight:650}
.stop .d{font-size:13px;color:var(--mute);margin-top:2px}
.move{background:#F4EFE6;font-size:12.5px;color:#5A5344;padding:8px 15px 8px 78px}
.budget{background:var(--cobalt);color:#fff;font-size:13px;padding:11px 15px;display:flex;justify-content:space-between}

.hot .badge{display:inline-block;font-size:10.5px;font-weight:750;letter-spacing:.07em;
  background:var(--cobalt);color:#fff;padding:3px 8px;border-radius:2px;margin-bottom:8px}
.hot .badge.warn{background:#B0524B}
.hot h4{margin:0 0 2px;font-size:17px;font-weight:650}
.hot .meta{font-size:13px;color:var(--mute);margin:0 0 4px}
.hot .price{font-family:var(--serif);font-size:22px;color:var(--cobalt);margin:0 0 10px}
.hot .price small{font-family:var(--sans);font-size:12px;color:var(--mute)}
.walk{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.walk div{font-size:12px;background:#EFEAE0;padding:5px 8px;border-radius:2px}
.walk div b{color:var(--turq)}
.walk div.far b{color:#B0524B}
.hot p{font-size:14px;margin:0}
.hot.pick{border:2px solid var(--cobalt)}

.phr div{padding:12px 14px;border-bottom:1px solid #F0EAE0}
.phr div:last-child{border-bottom:none}
.phr .tr{font-family:var(--serif);font-size:17.5px;color:var(--cobalt)}
.phr .en{font-size:13px;color:var(--mute)}

.callout{background:var(--cobalt);color:#fff;padding:17px 18px;border-radius:2px;margin:18px 0}
.callout h4{margin:0 0 6px;font-family:var(--serif);font-size:18px;font-weight:600}
.callout p{margin:0;font-size:14px;color:#D6E5F4}
.callout.warn{background:#8C2F28}
.callout.warn p{color:#F5DCD9}

.bigbtn{display:block;width:100%;padding:15px;background:var(--cobalt);color:#fff;border:none;
  border-radius:2px;font-size:15px;font-weight:650;cursor:pointer;margin:6px 0}
.ghost{background:none;color:var(--cobalt);border:1px solid var(--line)}
.stats{display:flex;gap:8px;margin:0 0 16px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);padding:13px 10px;border-radius:2px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:27px;color:var(--cobalt);line-height:1.1}
.stats span{font-size:11.5px;color:var(--mute)}
#report{margin-top:18px}
#report h4{font-family:var(--serif);font-size:19px;margin:20px 0 8px}
.rep{background:var(--card);border:1px solid var(--line);padding:13px 15px;margin-bottom:8px;border-radius:2px}
.rep .rn{font-weight:650;font-size:15px}
.rep .rm{font-size:12.5px;color:var(--mute);margin:2px 0 6px}
.rep .rv{font-size:13px;font-weight:650}
.rep .ri{font-size:13.5px;margin-top:5px}
.rep .rp{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.rep .rp img{width:60px;height:60px;object-fit:cover;border-radius:2px}
footer{border-top:1px solid var(--line);margin-top:38px;padding:20px 0 8px;font-size:12.5px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{nav,header.top,.acts,.bigbtn,footer{display:none!important}.view{display:block!important}}
</style>
</head>

/* photos in IndexedDB */
let DB=null;
function db(){ return new Promise((res,rej)=>{ if(DB) return res(DB);
  const r=indexedDB.open('aqui-photos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('p');
  r.onsuccess=()=>{DB=r.result;res(DB)}; r.onerror=()=>rej(r.error); }); }
async function putPhoto(k,blob){ const d=await db(); return new Promise((res,rej)=>{
  const tx=d.transaction('p','readwrite'); tx.objectStore('p').put(blob,k);
  tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function getPhoto(k){ const d=await db(); return new Promise((res,rej)=>{
  const rq=d.transaction('p','readonly').objectStore('p').get(k);
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function delPhoto(k){ const d=await db(); return new Promise(res=>{
  const tx=d.transaction('p','readwrite'); tx.objectStore('p').delete(k); tx.oncomplete=res; }); }

function shrink(file){ return new Promise(res=>{
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const M=1100, s=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(url);res(b)},'image/jpeg',0.72); };
  img.src=url; }); }

async function renderPhotos(id){
  const wrap=document.querySelector(`[data-shop="${id}"] [data-ph]`); if(!wrap)return;
  const st=sh(id); wrap.innerHTML='';
  for(const k of st.photos){
    const b=await getPhoto(k); if(!b)continue;
    const f=document.createElement('figure');
    const im=document.createElement('img'); im.src=URL.createObjectURL(b); im.alt='';
    const x=document.createElement('button'); x.textContent='×'; x.setAttribute('aria-label','Remove photo');
    x.onclick=async()=>{ await delPhoto(k); st.photos=st.photos.filter(p=>p!==k); save(); renderPhotos(id); };
    f.append(im,x); wrap.append(f);
  }
}

  const id=card.dataset.shop, st=sh(id);

  if(v){ st.verdict = st.verdict===v.dataset.v ? '' : v.dataset.v; st.v=!!st.verdict; save();

    card.outerHTML=shopCard({...d.shops.find(s=>s.id===id),dc:d.c}); renderPhotos(id); return; }
  const c=e.target.closest('[data-cat]');

});

/* ══════════════ REPORT ══════════════ */
async function drawReport(){
  const all=allShops();
  const visited=all.filter(s=>sh(s.id).v);
  const useful=visited.filter(s=>sh(s.id).verdict==='useful');
  const maybe=visited.filter(s=>sh(s.id).verdict==='maybe');
  const no=visited.filter(s=>sh(s.id).verdict==='no');
  const catCount={};
  useful.concat(maybe).forEach(s=>sh(s.id).cats.forEach(c=>catCount[c]=(catCount[c]||0)+1));
  const top=Object.entries(catCount).sort((a,b)=>b[1]-a[1]);
  let nPhotos=0; visited.forEach(s=>nPhotos+=sh(s.id).photos.length);

  const block=async list=>{
    let out='';
    for(const s of list){
      const st=sh(s.id);
      let imgs='';
      for(const k of st.photos){ const b=await getPhoto(k); if(b) imgs+=`<img src="${URL.createObjectURL(b)}" alt="">`; }
      out+=`<div class="rep">
        <div class="rn">${esc(s.n)}</div>
        <div class="rm">${esc(s.dn)} · ${esc(s.a)}${s.t?' · '+esc(s.t):''}</div>
        ${st.cats.length?`<div class="ri"><b>Had:</b> ${st.cats.map(esc).join(', ')}</div>`:''}
        ${st.note?`<div class="ri">${esc(st.note)}</div>`:''}
        ${imgs?`<div class="rp">${imgs}</div>`:''}
      </div>`;
    }
    return out||'<div class="rep" style="color:var(--mute);font-size:13.5px">Nothing recorded yet.</div>';
  };

  document.getElementById('v-report').innerHTML=`
   <h2>Trip report</h2>
   <p class="lede">Builds itself from what you mark on the Fabric tab. Download it as a file, or print to PDF, when you get home.</p>
   <div class="stats">
     <div><b>${visited.length}</b><span>of ${all.length} visited</span></div>
     <div><b>${useful.length}</b><span>useful</span></div>
     <div><b>${nPhotos}</b><span>photos</span></div>
   </div>
   ${top.length?`<div class="card"><div class="pad"><p class="lbl">FABRICS FOUND, BY HOW MANY SUPPLIERS</p>
     <div class="tags">${top.map(([c,n])=>`<span class="tag cat">${esc(c)} · ${n}</span>`).join('')}</div></div></div>`:''}
   <div id="report">
     <h4>Worth ordering from</h4>${await block(useful)}
     <h4>Worth a second look</h4>${await block(maybe)}
     <h4>Ruled out</h4>${no.length
        ? no.map(s=>`<div class="rep"><div class="rn">${esc(s.n)}</div><div class="rm">${esc(s.dn)}${sh(s.id).note?' · '+esc(sh(s.id).note):''}</div></div>`).join('')
        : '<div class="rep" style="color:var(--mute);font-size:13.5px">Nothing ruled out yet.</div>'}
   </div>
   <button class="bigbtn" id="dl">Download the report</button>
   <button class="bigbtn ghost" id="pr">Print or save as PDF</button>
   <footer>Wear Aqui · Istanbul, 4–13 September 2026. Everything you record stays on this phone.</footer>`;

  document.getElementById('pr').onclick=()=>window.print();
  document.getElementById('dl').onclick=async()=>{
    let html=`<!DOCTYPE html><meta charset="utf-8"><title>Wear Aqui — Istanbul report</title>
    <style>body{font-family:Georgia,serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.6;color:#1A1D22}
    h1{font-size:30px;margin-bottom:2px}h2{font-size:20px;margin-top:34px;border-bottom:1px solid #DED5C6;padding-bottom:5px}
    .s{border:1px solid #DED5C6;padding:14px 16px;margin:10px 0;border-radius:3px}
    .n{font-weight:700;font-size:17px}.m{color:#6C7480;font-size:13px;margin:3px 0 7px}
    .c{font-size:14px}img{width:150px;height:150px;object-fit:cover;margin:6px 6px 0 0;border-radius:3px}
    .sum{color:#6C7480}</style>
    <h1>Wear Aqui — Istanbul sourcing</h1>
    <p class="sum">4–13 September 2026 · ${visited.length} of ${all.length} suppliers visited · ${useful.length} rated useful · ${nPhotos} photos</p>`;
    const sect=async(t,list)=>{ let o=`<h2>${t}</h2>`;
      if(!list.length) o+='<p class="sum">None recorded.</p>';
      for(const s of list){ const st=sh(s.id); let im='';
        for(const k of st.photos){ const b=await getPhoto(k); if(b) im+=`<img src="${await toDataURL(b)}">`; }
        o+=`<div class="s"><div class="n">${esc(s.n)}</div>
        <div class="m">${esc(s.dn)} · ${esc(s.a)}${s.t?' · '+esc(s.t):''}${s.w?' · '+esc(s.w):''}</div>
        ${st.cats.length?`<div class="c"><b>Had:</b> ${st.cats.map(esc).join(', ')}</div>`:''}
        ${st.note?`<div class="c">${esc(st.note)}</div>`:''}${im}</div>`; }
      return o; };
    html+=await sect('Worth ordering from',useful);
    html+=await sect('Worth a second look',maybe);
    html+=await sect('Ruled out',no);
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='wear-aqui-istanbul-report.html'; a.click();
  };
}
function toDataURL(blob){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); }); }
