<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AQUI Istanbul">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>AQUI · İstanbul</title>
<style>
:root{
  --night:#0A0812; --panel:#14101F; --panel2:#1B1628; --line:#2B2440;
  --gold:#C9A961; --gold-dim:#8F7838; --moon:#A9B8E8; --crystal:#D8C3E8;
  --text:#EDE8F5; --dim:#948CAD; --warn:#E0A458; --danger:#E38096; --ok:#8FD9B6;
  --serif: ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ── masthead with falling light ── */
header.top{position:relative;overflow:hidden;background:var(--night);
  padding:26px 18px 20px;padding-top:calc(26px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line)}
#rain{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
header.top .in{position:relative;z-index:2}
.mark{display:block;width:78px;height:auto;margin:0 0 14px;opacity:.95}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--gold);margin:0 0 10px}
header.top h1{font-family:var(--serif);font-weight:500;font-size:42px;line-height:.95;margin:0;
  letter-spacing:.01em;color:var(--text)}
header.top h1 em{display:block;font-size:16px;font-style:italic;color:var(--crystal);margin-top:10px;letter-spacing:.02em}
.dates{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:16px;padding-top:12px;
  border-top:1px solid var(--line);letter-spacing:.04em}

/* ── nav ── */
nav{position:sticky;top:0;z-index:60;background:rgba(10,8,18,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav div{display:flex;padding:0 10px}
nav button{background:none;border:none;padding:14px 13px;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;color:var(--dim);white-space:nowrap;border-bottom:1px solid transparent;cursor:pointer}
nav button.on{color:var(--gold);border-bottom-color:var(--gold)}

main{padding:0 15px 70px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.view{display:none;padding-top:26px}
.view.on{display:block}
h2{font-family:var(--serif);font-size:30px;font-weight:500;margin:0 0 8px;line-height:1.1;letter-spacing:.01em}
h3.sub{font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--gold);
  margin:34px 0 12px;text-transform:uppercase}
.lede{color:var(--dim);font-size:14.5px;margin:0 0 20px;max-width:62ch}

.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin:0 0 11px}
.pad{padding:15px 16px}
.edge{border-left:2px solid var(--c,var(--gold))}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 8px;border-radius:2px;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.tag.gold{color:var(--gold);border-color:var(--gold-dim)}
.tag.ok{color:var(--ok);border-color:#2E6B52}
.tag.bad{color:var(--danger);border-color:#6B2E3D}
.tag.moon{color:var(--moon);border-color:#3A4470}

.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.acts a,.acts button{flex:1 1 0;min-width:74px;text-align:center;padding:10px 4px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-decoration:none;border-radius:2px;
  border:1px solid var(--line);color:var(--moon);background:var(--panel2);cursor:pointer}
.acts a.pri{background:var(--gold);color:#150F04;border-color:var(--gold);font-weight:700}
.acts a:focus-visible,.acts button:focus-visible,nav button:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

details.dis{border:1px solid var(--line);border-radius:3px;background:var(--panel);margin:0 0 11px;overflow:hidden}
details.dis>summary{list-style:none;cursor:pointer;padding:16px;border-left:2px solid var(--c,var(--gold))}
details.dis>summary::-webkit-details-marker{display:none}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh h3{margin:0;font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:.01em}
.dh .when{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--c,var(--gold));white-space:nowrap;padding-top:7px}
.dsub{font-size:13.5px;color:var(--dim);margin:5px 0 0}
.cnt{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:9px;letter-spacing:.08em}
.dbody{padding:2px 12px 15px}
.why{font-size:14px;background:var(--panel2);border-left:2px solid var(--c,var(--gold));
  padding:13px 14px;margin:0 0 14px;border-radius:2px;color:#D5CFE4}
.why b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}

.shop h4{margin:0 0 3px;font-size:16.5px;font-weight:600;letter-spacing:.01em}
.shop .addr{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:0 0 9px;line-height:1.5}
.shop .txt{font-size:14px;margin:0;color:#D5CFE4}
.visited{background:#12172A;border-color:#2E4470}
.visited h4::after{content:" ✦";color:var(--gold)}

.track{border-top:1px solid var(--line);margin-top:13px;padding-top:13px}
.verd{display:flex;gap:6px;margin-bottom:12px}
.verd button{flex:1;padding:9px 4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:2px;cursor:pointer}
.verd button.y{background:#1D4A38;border-color:var(--ok);color:var(--ok)}
.verd button.m{background:#4A3A1A;border-color:var(--warn);color:var(--warn)}
.verd button.n{background:#4A2030;border-color:var(--danger);color:var(--danger)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chips button{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:6px 9px;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:2px;cursor:pointer}
.chips button.on{background:var(--gold);border-color:var(--gold);color:#150F04;font-weight:700}
textarea{width:100%;min-height:66px;padding:11px;border:1px solid var(--line);border-radius:2px;
  background:var(--night);resize:vertical;font-size:14px}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 0}
.photos figure{margin:0;position:relative;width:74px;height:74px}
.photos img{width:74px;height:74px;object-fit:cover;border-radius:2px;border:1px solid var(--line)}
.photos button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  border:none;background:var(--danger);color:#2A0A12;font-size:13px;cursor:pointer;padding:0}
.addph{display:inline-block;margin-top:11px;padding:9px 14px;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;border:1px dashed var(--gold-dim);border-radius:2px;color:var(--gold);
  background:transparent;cursor:pointer}
input[type=file]{display:none}

.check label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;
  border-bottom:1px solid var(--line);font-size:14.5px}
.check label:last-child{border-bottom:none}
.check input{appearance:none;flex:0 0 19px;width:19px;height:19px;margin-top:2px;border:1px solid #4A4166;
  border-radius:2px;background:var(--night);position:relative;cursor:pointer}
.check input:checked{background:var(--gold);border-color:var(--gold)}
.check input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #150F04;border-width:0 2px 2px 0;transform:rotate(42deg)}
.check input:checked + span{text-decoration:line-through;color:#5F5878}
.prog{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);margin:0 0 10px}

.day{cursor:pointer}
.day .dtop{display:flex;gap:13px;align-items:baseline;padding:15px 16px 0}
.day .num{font-family:var(--serif);font-size:28px;color:var(--gold);line-height:1}
.day .dow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
.day .ttl{font-size:17px;font-weight:600;padding:3px 16px 0;letter-spacing:.01em}
.day .sm{font-family:var(--mono);font-size:11px;color:var(--dim);padding:6px 16px 15px;letter-spacing:.03em}
.day.today{border-color:var(--gold)}
.sched{border-top:1px solid var(--line)}
.stop{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #221C34}
.stop:last-child{border-bottom:none}
.stop .t{flex:0 0 54px;font-family:var(--mono);font-size:11.5px;color:var(--gold);padding-top:2px;letter-spacing:.03em}
.stop .n{font-size:14.5px;font-weight:600}
.stop .d{font-size:13.5px;color:#B8B0CC;margin-top:3px}
.move{background:var(--panel2);font-family:var(--mono);font-size:10.5px;color:var(--moon);
  padding:9px 16px 9px 82px;letter-spacing:.04em}
.budget{background:var(--panel2);border-top:1px solid var(--line);font-family:var(--mono);
  font-size:10.5px;color:var(--gold);padding:12px 16px;letter-spacing:.08em}

.hero{background:linear-gradient(160deg,#1B1628,#0E0B18);border:1px solid var(--gold-dim);
  border-radius:3px;padding:20px 18px;margin-bottom:14px}
.hero .badge{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--gold);margin-bottom:10px}
.hero h4{font-family:var(--serif);font-size:25px;font-weight:500;margin:0 0 4px}
.hero .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.grid div{background:var(--night);border:1px solid var(--line);padding:11px;border-radius:2px}
.grid .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim)}
.grid .v{font-family:var(--serif);font-size:19px;color:var(--gold);margin-top:3px}

.note{background:var(--panel2);border-left:2px solid var(--warn);padding:13px 15px;
  border-radius:2px;margin:14px 0;font-size:14px;color:#D5CFE4}
.note b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--warn);margin-bottom:6px}
.note.crys{border-left-color:var(--crystal)}
.note.crys b{color:var(--crystal)}

.phr div{padding:13px 15px;border-bottom:1px solid var(--line)}
.phr div:last-child{border-bottom:none}
.phr .tr{font-family:var(--serif);font-size:19px;color:var(--gold)}
.phr .en{font-size:13px;color:var(--dim);margin-top:2px}

.bigbtn{display:block;width:100%;padding:15px;background:var(--gold);color:#150F04;border:none;
  border-radius:2px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;cursor:pointer;margin:8px 0}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold-dim)}
.stats{display:flex;gap:8px;margin:0 0 18px}
.stats div{flex:1;background:var(--panel);border:1px solid var(--line);padding:14px 10px;border-radius:3px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:30px;color:var(--gold);line-height:1.1}
.stats span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim)}
.rep{background:var(--panel);border:1px solid var(--line);padding:14px 15px;margin-bottom:9px;border-radius:3px}
.rep .rn{font-weight:600;font-size:15.5px}
.rep .rm{font-family:var(--mono);font-size:11px;color:var(--dim);margin:3px 0 7px}
.rep .ri{font-size:13.5px;margin-top:5px;color:#D5CFE4}
.rep .rp{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.rep .rp img{width:60px;height:60px;object-fit:cover;border-radius:2px}
footer{border-top:1px solid var(--line);margin-top:42px;padding:22px 0 10px;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.05em}

.lead{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--crystal);
  border-radius:3px;margin:0 0 11px;padding:15px 16px}
.lead.done{border-left-color:var(--ok)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.f{display:block}
.f span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--gold);margin-bottom:4px}
.f input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;
  background:var(--night);font-size:14px}
.f.full{grid-column:1/-1}
.leadhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.leadhead .ln{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim)}
.del{background:none;border:1px solid var(--line);color:var(--danger);font-family:var(--mono);
  font-size:10px;letter-spacing:.1em;padding:5px 10px;border-radius:2px;cursor:pointer}
.cardslot{margin:12px 0 0}
.cardslot img{width:100%;max-height:190px;object-fit:contain;background:#fff;border-radius:2px;
  border:1px solid var(--line);cursor:pointer}
.cardslot .wrap{position:relative}
.cardslot .px{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;
  border:none;background:var(--danger);color:#2A0A12;font-size:14px;cursor:pointer;padding:0}

.passes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px;text-align:center}
.pw{position:relative;min-height:120px;display:flex;align-items:center;justify-content:center}
.pw img{width:100%;max-height:200px;object-fit:contain;border-radius:2px;cursor:pointer;background:#fff}
.pw .px{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:none;
  background:var(--danger);color:#2A0A12;font-size:14px;cursor:pointer;padding:0}
.pempty{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gold);line-height:1.9}
.pempty span{display:block;font-size:9.5px;letter-spacing:.08em;color:var(--dim)}
.pass .addph{width:100%;margin-top:8px;font-size:10px;padding:8px 4px}
.lightbox{position:fixed;inset:0;z-index:999;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:14px}
.lightbox img{max-width:100%;max-height:88vh;object-fit:contain}
.lbtop{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#555;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#rain{display:none}}
@media print{nav,header.top,.acts,.bigbtn,footer{display:none!important}.view{display:block!important}}
</style>
</head>

 return `<div class="lead ${l.verdict==='useful'?'done':''}" data-lead="${l.id}">
  <div class="leadhead"><span class="ln">LEAD ${String(i+1).padStart(2,'0')}</span>
   <button class="del" data-del>DELETE</button></div>
  <div class="frow">
   <label class="f full"><span>COMPANY</span><input data-k="name" value="${esc(l.name)}" placeholder="Mill or supplier name"></label>

function drawLeads(){
 const n=S.leads.length, use=S.leads.filter(l=>l.verdict==='useful').length;
 document.getElementById('v-leads').innerHTML=`
  <h2>New suppliers</h2>
  <p class="lede">For everyone you meet at the fair. Photograph the business card, tap the fabrics they showed, and write the price and minimum while you're still standing there. It all goes into the report.</p>
  <div class="stats"><div><b>${n}</b><span>LEADS</span></div><div><b>${use}</b><span>USEFUL</span></div></div>
  <button class="bigbtn" id="addlead">+ ADD A SUPPLIER</button>
  ${n?S.leads.map((l,i)=>leadCard(l,i)).join(''):
   '<div class="note crys"><b>NOTHING YET</b>Add the first one when you meet them. Do it at the stand, not back at the hotel — by day three you will not remember which mill said what.</div>'}
  ${n?'<div class="note"><b>A TIP FROM THE FLOOR</b>Photograph the business card and the swatch together in one shot as well, so the reference number and the contact never get separated. If you need the card details as text later, your phone camera or Google Lens will read them straight off the photo.</div>':''}`;
 document.getElementById('addlead').onclick=()=>{S.leads.push(newLead());save();drawLeads();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
 S.leads.forEach(l=>{renderLeadCard(l.id);renderLeadPhotos(l.id)});
}
const findLead=id=>S.leads.find(l=>l.id===id);
async function renderLeadCard(id){
 const l=findLead(id);if(!l)return;
 const w=document.querySelector(`[data-lead="${id}"] [data-cardslot]`);if(!w)return;
 w.innerHTML='';if(!l.card)return;
 let b=null;try{b=await getPhoto(l.card)}catch(e){}
 if(!b)return;
 const d=document.createElement('div');d.className='wrap';
 const im=document.createElement('img');im.src=URL.createObjectURL(b);im.alt='Business card';
 im.onclick=()=>openPass(b,esc(l.name||'BUSINESS CARD'));
 const x=document.createElement('button');x.className='px';x.textContent='×';
 x.onclick=async ev=>{ev.stopPropagation();await delPhoto(l.card);l.card=null;save();renderLeadCard(id)};
 d.append(im,x);w.append(d);
}
async function renderLeadPhotos(id){
 const l=findLead(id);if(!l)return;
 const w=document.querySelector(`[data-lead="${id}"] [data-lph]`);if(!w)return;
 w.innerHTML='';
 for(const k of l.photos){const b=await getPhoto(k);if(!b)continue;
  const f=document.createElement('figure'),im=document.createElement('img');
  im.src=URL.createObjectURL(b);im.alt='';
  const x=document.createElement('button');x.textContent='×';
  x.onclick=async()=>{await delPhoto(k);l.photos=l.photos.filter(p=>p!==k);save();renderLeadPhotos(id)};
  f.append(im,x);w.append(f)}
}
document.getElementById('v-leads').addEventListener('input',e=>{
 const c=e.target.closest('[data-lead]');if(!c)return;
 const l=findLead(c.dataset.lead);if(!l)return;
 const k=e.target.dataset.k;if(!k)return;
 l[k]=e.target.value;save();
});
document.getElementById('v-leads').addEventListener('click',e=>{
 const c=e.target.closest('[data-lead]');if(!c)return;
 const l=findLead(c.dataset.lead);if(!l)return;
 if(e.target.closest('[data-del]')){
  if(!confirm('Delete this lead? It cannot be undone.'))return;
  Promise.all([l.card?delPhoto(l.card):null,...l.photos.map(k=>delPhoto(k))]).catch(()=>{});
  S.leads=S.leads.filter(x=>x.id!==l.id);save();drawLeads();return}
 const v=e.target.closest('[data-lv]');
 if(v){l.verdict=l.verdict===v.dataset.lv?'':v.dataset.lv;save();drawLeads();return}
 const cat=e.target.closest('[data-lcat]');
 if(cat){const k=cat.dataset.lcat;
  l.cats=l.cats.includes(k)?l.cats.filter(x=>x!==k):l.cats.concat(k);
  cat.classList.toggle('on');save()}
});
document.getElementById('v-leads').addEventListener('change',async e=>{
 const c=e.target.closest('[data-lead]');if(!c)return;
 const l=findLead(c.dataset.lead);if(!l)return;
 const f=e.target.files&&e.target.files[0];if(!f)return;
 const b=await shrink(f),k=l.id+'-'+Date.now();
 await putPhoto(k,b);
 if(e.target.matches('[data-lcard]')){if(l.card)await delPhoto(l.card);l.card=k;save();renderLeadCard(l.id)}
 else if(e.target.matches('[data-lfile]')){l.photos.push(k);save();renderLeadPhotos(l.id)}
 e.target.value='';
});

let DB=null;
function db(){return new Promise((res,rej)=>{if(DB)return res(DB);
 const r=indexedDB.open('aqui-photos',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('p');
 r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>rej(r.error)})}
async function putPhoto(k,b){const d=await db();return new Promise((res,rej)=>{
 const tx=d.transaction('p','readwrite');tx.objectStore('p').put(b,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getPhoto(k){const d=await db();return new Promise((res,rej)=>{
 const q=d.transaction('p','readonly').objectStore('p').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function delPhoto(k){const d=await db();return new Promise(res=>{
 const tx=d.transaction('p','readwrite');tx.objectStore('p').delete(k);tx.oncomplete=res})}
function shrink(f){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{const M=1100,s=Math.min(1,M/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{URL.revokeObjectURL(u);res(b)},'image/jpeg',.72)};img.src=u})}

/* ═══════════ FABRIC ═══════════ */
function shopCard(s){
 const st=sh(s.id);
 const tags=s.tags.map(t=>{let c='tag';
  if(/^Sun|English|Open Sat/.test(t))c='tag ok';
  else if(/Closed|Check price|Inspect|Wholesale only/.test(t))c='tag bad';
  else if(/Best|specialist|All trims|Crystal/.test(t))c='tag gold';
  return `<span class="${c}">${esc(t)}</span>`}).join('');
 return `<div class="card shop ${st.v?'visited':''}" style="border-left:2px solid ${s.dc}" data-shop="${s.id}"><div class="pad">
  <h4>${esc(s.n)}</h4><p class="addr">${esc(s.a)}</p><p class="txt">${esc(s.x)}</p>
  <div class="tags">${s.cats.map(c=>`<span class="tag moon">${esc(c)}</span>`).join('')}</div>
  <div class="tags">${tags}</div>
  <div class="acts"><a class="pri" href="${maps(s.g)}" target="_blank" rel="noopener">MAP</a>
   ${s.t?`<a href="tel:${s.t}">CALL</a>`:''}
   ${s.w?`<a href="https://${s.w}" target="_blank" rel="noopener">SITE</a>`:''}
   <a href="${ig(s.ig)}" target="_blank" rel="noopener">IG</a></div>
  <div class="track">
   <div class="verd">
    <button data-v="useful" class="${st.verdict==='useful'?'y':''}">USEFUL</button>
    <button data-v="maybe" class="${st.verdict==='maybe'?'m':''}">MAYBE</button>
    <button data-v="no" class="${st.verdict==='no'?'n':''}">NO</button></div>
   <p class="lbl">WHAT THEY HAD</p>
   <div class="chips">${CATS.map(c=>`<button data-cat="${esc(c)}" class="${st.cats.includes(c)?'on':''}">${esc(c)}</button>`).join('')}</div>
   <p class="lbl">NOTES — PRICE, MINIMUM, CONTACT, LEAD TIME</p>
   <textarea data-note placeholder="220gsm viscose crepe · 180 TRY/m · min 50 m · ships via own agent · ask for Mehmet">${esc(st.note)}</textarea>
   <div class="photos" data-ph></div>
   <label class="addph">+ ADD PHOTO<input type="file" accept="image/*" data-file></label>
  </div></div></div>`;
}

  ${Object.entries(DISTRICTS).map(([k,d],i)=>`

    <summary><div class="dh"><div><h3>${esc(d.name)}</h3><p class="dsub">${esc(d.sub)}</p></div>

async function renderPhotos(id){
 const w=document.querySelector(`[data-shop="${id}"] [data-ph]`);if(!w)return;
 const st=sh(id);w.innerHTML='';
 for(const k of st.photos){const b=await getPhoto(k);if(!b)continue;
  const f=document.createElement('figure'),im=document.createElement('img');
  im.src=URL.createObjectURL(b);im.alt='';
  const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Remove');
  x.onclick=async()=>{await delPhoto(k);st.photos=st.photos.filter(p=>p!==k);save();renderPhotos(id)};
  f.append(im,x);w.append(f)}
}
document.getElementById('v-shops').addEventListener('click',e=>{
 const card=e.target.closest('[data-shop]');if(!card)return;
 const id=card.dataset.shop,st=sh(id),v=e.target.closest('[data-v]');
 if(v){st.verdict=st.verdict===v.dataset.v?'':v.dataset.v;st.v=!!st.verdict;save();
  const info=allShops().find(s=>s.id===id),d=DISTRICTS[info.dk];
  card.outerHTML=shopCard({...d.shops.find(s=>s.id===id),dc:d.c});renderPhotos(id);return}
 const c=e.target.closest('[data-cat]');
 if(c){const k=c.dataset.cat;st.cats=st.cats.includes(k)?st.cats.filter(x=>x!==k):st.cats.concat(k);
  c.classList.toggle('on');st.v=true;save()}});
document.getElementById('v-shops').addEventListener('input',e=>{
 if(e.target.matches('[data-note]')){const id=e.target.closest('[data-shop]').dataset.shop;
  sh(id).note=e.target.value;sh(id).v=true;save()}});
document.getElementById('v-shops').addEventListener('change',async e=>{
 if(!e.target.matches('[data-file]'))return;
 const f=e.target.files[0];if(!f)return;
 const id=e.target.closest('[data-shop]').dataset.shop,st=sh(id);
 const b=await shrink(f),k=id+'-'+Date.now();
 await putPhoto(k,b);st.photos.push(k);st.v=true;save();renderPhotos(id);e.target.value=''});

async function renderPass(k){
 const wrap=document.querySelector(`[data-pass="${k}"] [data-pw]`);if(!wrap)return;
 const key='pass-'+k;let b=null;
 try{b=await getPhoto(key)}catch(e){}
 const who=k==='c'?'CORNELIUS':'LAYLA';
 if(!b){wrap.innerHTML=`<div class="pempty">${who}<span>no badge added</span></div>`;return}
 wrap.innerHTML='';
 const im=document.createElement('img');im.src=URL.createObjectURL(b);im.alt=who+' badge';
 im.onclick=()=>openPass(b,who);
 const x=document.createElement('button');x.className='px';x.textContent='×';x.setAttribute('aria-label','Remove badge');
 x.onclick=async ev=>{ev.stopPropagation();await delPhoto(key);renderPass(k)};
 wrap.append(im,x);
}
function openPass(blob,who){
 const o=document.createElement('div');o.className='lightbox';
 o.innerHTML=`<div class="lbtop">${who} — tap anywhere to close</div>`;
 const im=document.createElement('img');im.src=URL.createObjectURL(blob);im.alt='';
 o.append(im);o.onclick=()=>o.remove();document.body.append(o);
}
document.getElementById('v-fair').addEventListener('change',async e=>{
 const inp=e.target.closest('[data-pass-file]');if(!inp)return;
 const f=inp.files[0];if(!f)return;
 const k=inp.dataset.passFile;
 const b=await shrink(f);
 await putPhoto('pass-'+k,b);renderPass(k);inp.value='';
});

async function drawReport(){
 const all=allShops(),vis=all.filter(s=>sh(s.id).v);
 const use=vis.filter(s=>sh(s.id).verdict==='useful'),may=vis.filter(s=>sh(s.id).verdict==='maybe'),no=vis.filter(s=>sh(s.id).verdict==='no');
 const cc={};use.concat(may).forEach(s=>sh(s.id).cats.forEach(c=>cc[c]=(cc[c]||0)+1));
 const top=Object.entries(cc).sort((a,b)=>b[1]-a[1]);
 let np=0;vis.forEach(s=>np+=sh(s.id).photos.length);
 const block=async list=>{let o='';
  for(const s of list){const st=sh(s.id);let im='';
   for(const k of st.photos){const b=await getPhoto(k);if(b)im+=`<img src="${URL.createObjectURL(b)}" alt="">`}
   o+=`<div class="rep"><div class="rn">${esc(s.n)}</div>
    <div class="rm">${esc(s.dn)} · ${esc(s.a)}${s.t?' · '+esc(s.t):''}</div>
    ${st.cats.length?`<div class="ri"><b style="color:var(--gold)">Had:</b> ${st.cats.map(esc).join(', ')}</div>`:''}
    ${st.note?`<div class="ri">${esc(st.note)}</div>`:''}
    ${im?`<div class="rp">${im}</div>`:''}</div>`}
  return o||'<div class="rep" style="color:var(--dim);font-size:13.5px">Nothing recorded yet.</div>'};

async function leadBlock(list){
 if(!list.length)return '<div class="rep" style="color:var(--dim);font-size:13.5px">Nothing recorded yet.</div>';
 let o='';
 for(const l of list){
  let im='';
  if(l.card){const b=await getPhoto(l.card);if(b)im+=`<img src="${URL.createObjectURL(b)}" alt="card">`}
  for(const k of l.photos){const b=await getPhoto(k);if(b)im+=`<img src="${URL.createObjectURL(b)}" alt="">`}
  const bits=[l.person,l.stand,l.phone,l.email,l.site].filter(Boolean).map(esc).join(' · ');
  o+=`<div class="rep"><div class="rn">${esc(l.name||'(unnamed)')}</div>
   ${bits?`<div class="rm">${bits}</div>`:''}
   ${l.cats.length?`<div class="ri"><b style="color:var(--gold)">Showed:</b> ${l.cats.map(esc).join(', ')}</div>`:''}
   ${l.note?`<div class="ri">${esc(l.note)}</div>`:''}
   ${im?`<div class="rp">${im}</div>`:''}</div>`}
 return o;
}
function toURL(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}

/* ═══════════ FALLING LIGHT ═══════════ */
(function(){
 const c=document.getElementById('rain');if(!c)return;
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const x=c.getContext('2d');let W,H,cols,drops;
 const glyphs='AQUI◆✦✧·|/\\0123456789';
 function size(){W=c.width=c.offsetWidth*devicePixelRatio;H=c.height=c.offsetHeight*devicePixelRatio;
  cols=Math.floor(W/(14*devicePixelRatio));drops=Array(cols).fill(0).map(()=>Math.random()*-40)}
 size();addEventListener('resize',size);
 const tint=['#C9A961','#A9B8E8','#D8C3E8'];
 function draw(){
  x.fillStyle='rgba(10,8,18,0.12)';x.fillRect(0,0,W,H);
  x.font=`${13*devicePixelRatio}px ui-monospace,monospace`;
  for(let i=0;i<cols;i++){
   const ch=glyphs[Math.floor(Math.random()*glyphs.length)];
   x.fillStyle=tint[i%3];x.globalAlpha=Math.random()*.45+.12;
   x.fillText(ch,i*14*devicePixelRatio,drops[i]*16*devicePixelRatio);
   if(drops[i]*16*devicePixelRatio>H&&Math.random()>.982)drops[i]=0;
   drops[i]+=0.35}
  x.globalAlpha=1;requestAnimationFrame(draw)}
 draw();
})();
